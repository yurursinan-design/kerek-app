# Temporary: read-only check of the Yandex Cloud (Kazakhstan) access key, sizes and prices.
# Creates nothing. Removed after it runs.
name: yc-check

on:
  push:
    branches: ['claude/kerek-source-access-x39385']
    paths: ['.github/workflows/yc-check.yml']

permissions:
  contents: read

env:
  YC_CLOUD_ID: ao70tiqd8f0ugucc2ti6
  YC_FOLDER_ID: ao7ved3gvt41ugsckh6f
  YC_SA_ID: b2b3ekec87o7d50evgk7
  YC_KEY_ID: b2bb30rgupqo4ihdkcn1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"

      - name: Configure access (Kazakhstan installation)
        env:
          RAW_KEY: ${{ secrets.YC_SA_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re
          raw = os.environ['RAW_KEY'].replace('\r', '')
          m = re.search(r'(PLEASE DO NOT REMOVE THIS LINE![^\n]*\n)?-----BEGIN PRIVATE KEY-----.*?-----END PRIVATE KEY-----', raw, re.S)
          if not m:
              raise SystemExit('private key block not found in the secret')
          key = {'id': os.environ['YC_KEY_ID'], 'service_account_id': os.environ['YC_SA_ID'], 'key_algorithm': 'RSA_2048', 'private_key': m.group(0) + '\n'}
          path = os.path.join(os.environ['RUNNER_TEMP'], 'key.json')
          with open(path, 'w') as f:
              json.dump(key, f)
          os.chmod(path, 0o600)
          PY
          yc config profile create kz >/dev/null
          yc config set endpoint api.yandexcloud.kz:443
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Read-only checks
        run: |
          echo "== Access"; yc resource-manager folder get "$YC_FOLDER_ID" --format json | jq -r '"folder: \(.name) (\(.status))"'
          echo "== Zones"; yc compute zone list --format json | jq -r '.[] | "\(.id) \(.status)"'
          echo "== Existing resources"
          echo "VMs: $(yc compute instance list --format json | jq length)"
          echo "PostgreSQL clusters: $(yc managed-postgresql cluster list --format json | jq length)"
          echo "Buckets: $(yc storage bucket list --format json | jq -r '.[].name' | tr '\n' ' ')"
          echo "== PostgreSQL sizes available"
          yc managed-postgresql resource-preset list --format json | jq -r '.[] | select(.zone_ids | index("kz1-a")) | "\(.id)  cores=\(.cores)  memory=\(.memory/1073741824)GB"' | sort -t= -k2 -n | head -20
          echo "== Prices (KZT)"
          TOKEN=$(yc iam create-token)
          for host in billing.api.yandexcloud.kz billing.api.cloud.yandex.net; do
            out=$(curl -s --max-time 30 -H "Authorization: Bearer $TOKEN" "https://$host/billing/v1/skus?currency=KZT&pageSize=1000")
            if echo "$out" | jq -e '.skus' >/dev/null 2>&1; then
              echo "(from $host)"
              echo "$out" | jq -r '.skus[] | select(.name | test("PostgreSQL|Intel Ice Lake|Standard network drive|SSD|Object Storage|Public IP"; "i")) | "\(.name) | \(.pricingVersions[-1].pricingExpressions[0].rates[0].unitPrice // "?") ₸ per \(.pricingUnit)"' | sort -u | head -60
              break
            else
              echo "$host: $(echo "$out" | head -c 200)"
            fi
          done
          rm -f "$RUNNER_TEMP/key.json"
