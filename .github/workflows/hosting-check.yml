# Temporary: public DNS, certificate and policy facts about naimi.kz (removed right after it runs)
name: hosting-check

on:
  push:
    branches: ['claude/kerek-source-access-x39385']
    paths: ['.github/workflows/hosting-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Naimi subdomains and privacy text
        run: |
          ipline() { curl -s --max-time 10 "https://ipinfo.io/$1/json" | jq -r '"\(.ip)  \(.org // "?")  \(.city // "?"), \(.country // "?")"'; }
          for s in static.naimi.kz cdn.naimi.kz img.naimi.kz media.naimi.kz files.naimi.kz admin.naimi.kz partner.naimi.kz pro.naimi.kz m.naimi.kz ws.naimi.kz chat.naimi.kz pay.naimi.kz mail.naimi.kz backend.naimi.kz api2.naimi.kz app.naimi.kz; do
            c=$(dig +short CNAME "$s" | head -1)
            for ip in $(dig +short A "$s" | grep -E '^[0-9.]+$' | head -2); do echo "$s ${c:+(CNAME $c)} -> $(ipline $ip)"; done
          done
          echo "== Privacy policy text"
          curl -s -L --max-time 30 -A "Mozilla/5.0" https://naimi.kz/legal/privacy-policy -o p.html
          python3 - <<'PY'
          import re, html
          raw = open('p.html', encoding='utf-8', errors='ignore').read()
          raw = raw.encode().decode('unicode_escape', errors='ignore') if '\\u04' in raw else raw
          txt = html.unescape(re.sub(r'<[^>]+>', ' ', raw))
          txt = re.sub(r'\s+', ' ', txt)
          for kw in ['территори', 'сервер', 'трансгранич', 'хранени', 'база данных', 'базе данных', 'за пределы']:
              for m in re.finditer(kw, txt, re.I):
                  print('...', txt[max(0, m.start()-220): m.end()+220], '...')
                  print()
                  break
          PY
