# Uploads selected Cloud Functions before a full release, e.g. the WhatsApp login (with Google Play's
# review sign-in) and notification functions, so they can be tried on the preview and the Android app. Runs only for a commit on a claude/** branch
# whose message starts with "[deploy-functions]" (a mention further down doesn't count), only after
# all tests pass (tests.yml), and only the functions listed in ONLY (never the website or the
# database rules; those go live with deploy.yml after "canlıya al").
name: Fonksiyonları yükle

on:
  push:
    branches: ['claude/**']

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: kerek-9d153
  ONLY: functions:requestLoginCode,functions:verifyLoginCode,functions:onNewRequestNotifyProviders,functions:notifyOnOfferCreated,functions:notifyOnOfferUpdated,functions:notifyOnMessageCreated,functions:notifyOnRequestUpdated,functions:notifyOnAppointmentWritten,functions:pushOnNotificationCreated,functions:kzMirrorUsers,functions:kzMirrorProviders,functions:kzMirrorRequests,functions:kzMirrorRequestContacts,functions:kzMirrorOffers,functions:kzMirrorReviews,functions:kzMirrorConversations,functions:kzMirrorMessages,functions:kzMirrorAppointments,functions:kzMirrorNotifications,functions:kzMirrorReports,functions:kzMirrorPushTokens,functions:statsOnOfferCreated,functions:statsOnRequestCompleted,functions:claimAdmin,functions:adminListChanged,functions:kzMirrorCustomerReviews,functions:kzMirrorBans,functions:kzMirrorFileSaved,functions:kzMirrorFileDeleted,functions:ratingsOnReviewWritten,functions:moderateReviewSubmission,functions:decideReview,functions:reviewerPhone,functions:cleanupAccountData,functions:renewRequestFileLinks,functions:kzMirrorReviewSubmissions,functions:kzMirrorAccountSignals

jobs:
  # The same tests as the full release (tests.yml); nothing is uploaded unless they all pass
  test:
    if: startsWith(github.event.head_commit.message, '[deploy-functions]')
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    if: startsWith(github.event.head_commit.message, '[deploy-functions]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Fonksiyon bağımlılıklarını kur
        run: npm --prefix functions ci

      - name: Google Cloud'a giriş
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/24155315039/locations/global/workloadIdentityPools/github/providers/kerek-app
          service_account: github-deploy@kerek-9d153.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Cloud Storage hizmet hesabı
        # Storage triggers need the Cloud Storage service agent, which Google creates the first time
        # its address is asked for; it then needs Pub/Sub Publisher, granted once by the owner
        continue-on-error: true
        run: gcloud storage service-agent --project "$FIREBASE_PROJECT_ID"

      - name: Seçili fonksiyonları yükle
        run: |
          # Only function targets are accepted here
          for t in ${ONLY//,/ }; do case "$t" in functions:*) ;; *) echo "Not a function: $t"; exit 1 ;; esac; done
          echo "Yüklenenler: $ONLY → $FIREBASE_PROJECT_ID"
          npx --yes firebase-tools@15.31.0 deploy --only "$ONLY" --project "$FIREBASE_PROJECT_ID" --non-interactive --force
