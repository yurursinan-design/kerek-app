# Makes the app's photos (scripts/images/prompts.json) with Google's image model and commits the
# new ones under public/img/photo. Runs only for a commit on a claude/** branch whose message starts
# with "[images] ". Only missing photos are made; "[images] only: a b" remakes the listed ones.
name: Fotoğraflar

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  id-token: write

concurrency:
  group: images
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: kerek-9d153

jobs:
  images:
    if: startsWith(github.event.head_commit.message, '[images] ')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}

      - name: Google Cloud'a giriş
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/24155315039/locations/global/workloadIdentityPools/github/providers/kerek-app
          service_account: github-deploy@kerek-9d153.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Fotoğrafları üret
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          sudo apt-get install -y -qq imagemagick webp >/dev/null
          ONLY=$(printf '%s\n' "$MSG" | head -1 | sed -n 's/.*only: *//p')
          export ONLY
          # "[images] icon" makes the app icon options instead of the app photos
          if printf '%s\n' "$MSG" | head -1 | grep -q '^\[images\] icon'; then
            export PROMPTS=icon-prompts.json OUT_DIR=marketing/icon-options
          fi
          # The key never reaches the log: it only lives in this step's environment
          GEMINI_API_KEY=$(gcloud secrets versions access latest --secret GEMINI_API_KEY --project "$FIREBASE_PROJECT_ID" 2>/dev/null || true)
          export GEMINI_API_KEY
          python3 scripts/images/generate.py

      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/img/photo marketing/icon-options 2>/dev/null || git add public/img/photo
          if git diff --cached --quiet; then echo "Yeni fotoğraf yok"; exit 0; fi
          git commit -q -m "Add generated app photos"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
