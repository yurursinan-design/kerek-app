# Runs the test suites on every Pull Request and on main:
#   - type check (strict) and lint (React hooks, TypeScript and correctness rules, oxlint)
#   - known high or critical vulnerabilities in the locked packages (bun audit, npm audit)
#   - Firestore and Storage security rules tests (emulator)
#   - verify-* tests against the Firestore, Auth and Storage emulators
name: Testler

on:
  pull_request:
  push:
    branches: [main]
  # The deploy workflow runs these same tests first and only deploys when they pass
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The Firestore emulator runs on Java
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.31.0

      - name: Bağımlılıkları kur
        run: bun install --frozen-lockfile

      - name: Tip kontrolü ve kod denetimi (lint)
        run: bun run lint

      - name: Cloud Functions derleme kontrolü
        run: npm --prefix functions ci && npm --prefix functions run build

      # Known high or critical vulnerabilities in the app's and the functions' locked packages
      - name: Bağımlılık güvenlik taraması
        run: bun audit --audit-level=high && npm --prefix functions audit --audit-level=high --omit=dev

      - name: Güvenlik kuralı testleri
        run: npm run test:rules

      - name: Dosya (Storage) kuralı testleri
        run: npm run test:storage

      - name: Uygulama testleri
        run: npm run test:verify
