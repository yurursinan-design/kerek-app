# Google Play through its API (scripts/play.mjs). Runs only for a commit on a claude/** branch whose
# message starts with "[play] <job>":
#   check    what Play has now (nothing changes)
#   listing  store texts and images from store/
#   bundle   builds the signed app bundle and puts it on the "play-bundle" GitHub pre-release, for
#            the first upload, which Play only accepts by hand in Play Console
#   release  builds it and uploads it to closed testing as a draft
#   firebase registers the Play package in Firebase and prints its google-services.json
#   safetyref prints the Data safety question and answer IDs from Play Console Help (nothing changes)
# Releases stay drafts: rolling them out to testers or users is done in Play Console.
#
# The upload key that signs the bundle lives in Secret Manager (ANDROID_UPLOAD_KEY: password on the
# first line, the PKCS12 key file in base64 on the second). The first release run makes it.
name: Google Play

on:
  push:
    branches: ['claude/**']

permissions:
  # contents: write puts the bundle on a GitHub pre-release
  contents: write
  id-token: write

concurrency:
  group: google-play
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: kerek-9d153
  # Firebase web ayarları herkese açıktır (derlenen uygulamanın içinde zaten görünür).
  VITE_FIREBASE_API_KEY: AIzaSyA2tm7w5In7uV6qEPbfCjSOKZ6Sj2fRoHI
  VITE_FIREBASE_AUTH_DOMAIN: kerek-9d153.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: kerek-9d153
  VITE_FIREBASE_STORAGE_BUCKET: kerek-9d153.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: "24155315039"
  VITE_FIREBASE_APP_ID: 1:24155315039:web:203f5b6fb4aa78d62574ea

jobs:
  play:
    if: startsWith(github.event.head_commit.message, '[play] ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ne yapılacak
        id: mode
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # the word after "[play]", without punctuation ("check:" → check)
          mode=$(printf '%s\n' "$MSG" | head -n1 | awk '{print $2}' | tr -cd 'a-z')
          case "$mode" in check|listing|bundle|release|firebase|safetyref) ;; *) echo "Bilinmeyen iş: $mode (check | listing | bundle | release | firebase | safetyref)"; exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          case "$mode" in bundle|release) echo "build=true" >> "$GITHUB_OUTPUT" ;; esac
          echo "İş: $mode"

      - name: Google'a giriş
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/24155315039/locations/global/workloadIdentityPools/github/providers/kerek-app
          service_account: github-deploy@kerek-9d153.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher,https://www.googleapis.com/auth/cloud-platform

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # ---- bundle and release: build the signed app bundle
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.mode.outputs.build == 'true'
        with:
          bun-version: 1.4.2

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.mode.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        if: steps.mode.outputs.build == 'true'

      - name: Yükleme anahtarı
        if: steps.mode.outputs.build == 'true'
        run: |
          set -euo pipefail
          if ! gcloud secrets describe ANDROID_UPLOAD_KEY --project "$FIREBASE_PROJECT_ID" >/dev/null 2>&1; then
            echo "İlk yükleme: yeni yükleme anahtarı oluşturuluyor"
            pw=$(openssl rand -hex 24)
            echo "::add-mask::$pw"
            keytool -genkeypair -keystore "$RUNNER_TEMP/new.p12" -storetype PKCS12 -alias upload \
              -keyalg RSA -keysize 4096 -validity 10000 -storepass "$pw" -keypass "$pw" \
              -dname "CN=KEREK, O=KEREK, L=Kyzylorda, C=KZ" >/dev/null
            { echo "$pw"; base64 -w0 "$RUNNER_TEMP/new.p12"; echo; } > "$RUNNER_TEMP/key.txt"
            gcloud secrets create ANDROID_UPLOAD_KEY --data-file="$RUNNER_TEMP/key.txt" --project "$FIREBASE_PROJECT_ID" -q
            rm -f "$RUNNER_TEMP/new.p12" "$RUNNER_TEMP/key.txt"
          fi
          gcloud secrets versions access latest --secret=ANDROID_UPLOAD_KEY --project "$FIREBASE_PROJECT_ID" > "$RUNNER_TEMP/key.txt"
          pw=$(sed -n 1p "$RUNNER_TEMP/key.txt")
          echo "::add-mask::$pw"
          sed -n 2p "$RUNNER_TEMP/key.txt" | base64 -d > "$RUNNER_TEMP/upload.p12"
          rm -f "$RUNNER_TEMP/key.txt"
          {
            echo "KEREK_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.p12"
            echo "KEREK_UPLOAD_STORE_PASSWORD=$pw"
            # Every upload needs a higher number than the last one
            echo "KEREK_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))"
            echo "KEREK_VERSION_NAME=1.0"
          } >> "$GITHUB_ENV"
          echo "SHA-256 parmak izi (Firebase için):"
          keytool -list -keystore "$RUNNER_TEMP/upload.p12" -storetype PKCS12 -storepass "$pw" -alias upload | grep -i 'SHA-256\|SHA256' || true

      - name: Uygulama paketini derle
        if: steps.mode.outputs.build == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build
          npx cap sync android
          cd android && ./gradlew bundleRelease --no-daemon

      - name: Paketi GitHub'a koy
        if: steps.mode.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab "Tapsyr-$KEREK_VERSION_CODE.aab"
          gh release delete play-bundle --yes --cleanup-tag || true
          gh release create play-bundle "Tapsyr-$KEREK_VERSION_CODE.aab" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Tapsyr Google Play paketi ($KEREK_VERSION_CODE)" \
            --notes "Play Console'a yüklenecek imzalı paket (AAB). Kaynak: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"

      # ---- safetyref: prints the machine-readable question and answer IDs of the Data safety form
      - name: Veri güvenliği kimlikleri
        if: steps.mode.outputs.mode == 'safetyref'
        run: |
          curl -sSL -A 'Mozilla/5.0' 'https://support.google.com/googleplay/android-developer/answer/10787469?hl=en' -o ref.html
          python3 - <<'PY'
          import html, re
          t = open('ref.html', encoding='utf-8').read()
          t = re.sub(r'(?is)<(script|style).*?</\1>', '', t)
          t = re.sub(r'(?i)</(td|th)>', ' | ', t)
          t = re.sub(r'(?i)</(tr|p|li|h\d|div)>|<br\s*/?>', '\n', t)
          t = html.unescape(re.sub(r'<[^>]+>', '', t))
          lines = [re.sub(r'\s+', ' ', l).strip() for l in t.split('\n')]
          for i, l in enumerate(lines):
              if 'PSL_' in l or 'Question ID' in l or 'Response ID' in l or 'machine readable' in l.lower():
                  print(l)
          PY

      - name: Firebase Android uygulaması
        if: steps.mode.outputs.mode == 'firebase'
        env:
          GCP_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/firebase-android-app.mjs kerek.kz.app

      - name: Google Play
        if: steps.mode.outputs.mode != 'bundle' && steps.mode.outputs.mode != 'firebase' && steps.mode.outputs.mode != 'safetyref'
        env:
          PLAY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "release" ]; then
            node scripts/play.mjs release android/app/build/outputs/bundle/release/app-release.aab
          else
            node scripts/play.mjs "${{ steps.mode.outputs.mode }}"
          fi

      - name: Anahtar dosyasını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12" "$RUNNER_TEMP/key.txt"
