# Kazakh narration for the Tapsyr promo video with Gemini TTS (promo/voice/gemini_voice.py).
# Runs only for a commit on a claude/** branch whose message starts with "[voice-gemini] ": it reads
# the Gemini key from Secret Manager (the same way images.yml does), voices the lines named in
# promo/voice/lines.json ("gemini" block) and commits the WAVs (promo/voice/out-gemini/) back to
# the same branch. Nothing else in the project is changed.
name: Promo voice (Gemini)

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  id-token: write

concurrency:
  group: promo-voice-gemini
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: kerek-9d153

jobs:
  voice:
    if: startsWith(github.event.head_commit.message, '[voice-gemini] ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}

      - name: Google Cloud'a giriş
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/24155315039/locations/global/workloadIdentityPools/github/providers/kerek-app
          service_account: github-deploy@kerek-9d153.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Seslendir
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # The key never reaches the log: it only lives in this step's environment
          GEMINI_API_KEY=$(gcloud secrets versions access latest --secret GEMINI_API_KEY --project "$FIREBASE_PROJECT_ID")
          export GEMINI_API_KEY
          # "[voice-gemini] dialogue <file>" voices an ad's character lines instead of the narration
          ARG=$(printf '%s\n' "$MSG" | head -1 | sed -n 's/^\[voice-gemini\] dialogue \([^ ]*\).*/\1/p')
          if [ -n "$ARG" ]; then python3 promo/voice/gemini_dialogue.py "$ARG"; else python3 promo/voice/gemini_voice.py; fi

      - name: Kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add promo/voice/out-gemini promo/*/voice 2>/dev/null || true
          if git diff --cached --quiet; then echo "Yeni ses yok"; exit 0; fi
          git commit -q -m "Add Gemini narration audio"
          # the branch may have moved while this ran (other promo jobs, new commits)
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
